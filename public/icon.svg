<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="8 8" opacity="0.6"/>
  
  <!-- Inner Circle Plate -->
  <circle cx="256" cy="256" r="160" fill="url(#accentGrad)" filter="url(#glow)"/>

  <!-- Food & Cloche Icon -->
  <g transform="translate(136, 136)" fill="#ffffff">
    <!-- Dome Cloche -->
    <path d="M120 40 C70 40 28 80 20 130 L220 130 C212 80 170 40 120 40 Z"/>
    <!-- Cloche Knob -->
    <circle cx="120" cy="28" r="14" fill="#fde047"/>
    <!-- Cloche Platter Tray -->
    <rect x="10" y="140" width="220" height="18" rx="9" fill="#f8fafc"/>
    <!-- Steam / Warmth Lines -->
    <path d="M80 12 C80 6 90 2 90 -4" stroke="#fef08a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M120 10 C120 4 130 0 130 -6" stroke="#fef08a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M160 12 C160 6 170 2 170 -4" stroke="#fef08a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Fast Delivery Wing / Lightning Accent -->
    <path d="M90 175 L150 175 L115 210 L145 210 L85 255 L105 200 L80 200 Z" fill="#fde047"/>
  </g>
</svg>
